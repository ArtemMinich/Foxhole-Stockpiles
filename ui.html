<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #121124;
      --surface: #2A3958;
      --border:  #454B39;
      --text:    #F8FBFA;
      --subtext: #707276;
      --muted:   #4E4534;
      --accent:  #F19301;
      --green:   #D7A93F;
      --red:     #F19301;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }

    #app {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Shared ── */
    h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--subtext);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: var(--accent); }

    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .error-msg {
      color: var(--red);
      font-size: 12px;
      margin-top: 8px;
      min-height: 18px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    button {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary            { background: var(--accent); color: var(--bg); }
    .btn-primary:disabled   { background: var(--border); color: var(--muted); cursor: not-allowed; }
    .btn-secondary          { background: var(--surface); color: var(--subtext); border: 1px solid var(--border); }
    .btn-secondary:hover    { opacity: 0.8; }
    .btn-danger             { background: #490E10; color: #F8FBFA; border: 1px solid #671318; }

    /* ── Preview chips (add mode) ── */
    .preview {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      min-height: 28px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .chip.ok  { border-color: var(--green); color: var(--green); }
    .chip.err { border-color: var(--red);   color: var(--red); }
    .chip-label { opacity: 0.65; }

    /* ── Add mode wrapper ── */
    .add-wrapper {
      padding: 10px 14px 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ── Edit mode layout ── */
    .edit-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .edit-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .stockpile-path {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .stockpile-password-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #1A1E35;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .stockpile-password-row label {
      font-size: 11px;
      font-weight: 600;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      flex-shrink: 0;
    }
    .stockpile-password-input {
      min-width: 0;
      flex: 1;
      height: 28px;
      padding: 4px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font: 12px Consolas, Monaco, monospace;
      outline: none;
    }
    .stockpile-password-input:focus { border-color: var(--accent); }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-group {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .toggle-btn {
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      background: transparent;
      color: var(--subtext);
      border: none;
      border-radius: 0;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .toggle-btn.active {
      background: var(--accent);
      color: var(--bg);
    }

    .nonzero-count {
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Items table ── */
    .table-container {
      flex: 1;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 1;
      text-align: left;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }

    thead th.col-count { width: 90px; text-align: right; }

    tbody tr {
      border-bottom: 1px solid var(--surface);
      transition: background 0.1s;
    }
    tbody tr:hover { background: var(--surface); }
    tbody tr.hidden { display: none; }
    tbody tr.extra  { background: #4E4534; }

    td.col-name {
      padding: 6px 12px;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    td.col-name a {
      color: var(--text);
      text-decoration: none;
    }
    td.col-name a:hover { color: var(--accent); text-decoration: underline; }
    td.col-name .extra-badge {
      font-size: 10px;
      color: var(--muted);
      margin-left: 4px;
    }

    td.col-count {
      padding: 4px 12px;
      width: 90px;
      text-align: right;
    }
    td.col-count input[type="number"] {
      width: 70px;
      padding: 4px 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      text-align: right;
      outline: none;
      -moz-appearance: textfield;
      appearance: textfield;
    }
    td.col-count input[type="number"]::-webkit-outer-spin-button,
    td.col-count input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; }
    td.col-count input[type="number"]:focus { border-color: var(--accent); }
    td.col-count input[type="number"].nonzero { border-color: var(--green); color: var(--green); }

    .loading { color: var(--muted); padding: 40px; text-align: center; }

    /* ── FIR panel ── */
    .fir-panel {
      padding: 10px 16px 12px;
      background: #1A1E35;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .fir-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .fir-panel textarea {
      width: 100%;
      height: 110px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 11px;
      line-height: 1.4;
      padding: 8px 10px;
      resize: none;
      outline: none;
    }
    .fir-panel textarea:focus { border-color: var(--accent); }
    .fir-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }
    .fir-status { font-size: 12px; min-height: 16px; }
    .fir-status.ok  { color: var(--green); }
    .fir-status.err { color: var(--red); }
    .btn-sm { padding: 4px 10px; font-size: 11px; }
    .btn-fir { background: #2A3958; color: var(--accent); border: 1px solid var(--accent); }
    .btn-fir:hover { opacity: 0.85; }

    /* ── Config mode ── */
    .config-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 16px 0;
      overflow: hidden;
    }
    .config-search {
      margin-bottom: 10px;
    }
    .config-search input {
      width: 100%;
      padding: 7px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    .config-search input:focus { border-color: var(--accent); }
    .config-list {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .config-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--surface);
      font-size: 12px;
    }
    .config-item:last-child { border-bottom: none; }
    .config-item:hover { background: var(--surface); }
    .config-item.hidden { display: none; }
    .config-item input[type="checkbox"] {
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .config-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 14px;
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ── Export / Import modes ── */
    .export-wrapper, .import-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 16px 0;
      overflow: hidden;
    }

    .json-output {
      flex: 1;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 11px;
      line-height: 1.5;
      padding: 10px 12px;
      resize: none;
      outline: none;
      overflow-y: auto;
    }
    .json-output:focus { border-color: var(--accent); }

    .copy-status {
      font-size: 12px;
      color: var(--green);
      min-height: 20px;
      padding: 4px 0;
      flex-shrink: 0;
    }

    .replace-row {
      margin: 10px 0 4px;
      flex-shrink: 0;
    }
    .replace-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      text-transform: none;
      letter-spacing: normal;
      color: var(--text);
    }
    .replace-row input[type="checkbox"] {
      accent-color: var(--red);
      width: 14px;
      height: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .import-error {
      font-size: 12px;
      min-height: 20px;
      padding: 4px 0;
      flex-shrink: 0;
    }

    /* ── Category bar ── */
    .category-bar {
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
    }
    .category-bar::-webkit-scrollbar { height: 4px; }
    .category-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .cat-btn {
      width: 48px;
      height: 48px;
      border-radius: 7px;
      border: 2px solid transparent;
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      flex-shrink: 0;
      transition: border-color 0.1s;
    }
    .cat-btn:hover { border-color: var(--subtext); }
    .cat-btn.active { border-color: var(--accent); background: rgba(241,147,1,0.12); }
    .cat-btn img { width: 30px; height: 30px; object-fit: contain; }

    /* ── Items grid ── */
    .items-grid {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
      gap: 6px;
      align-content: start;
    }

    .item-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 4px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .item-card.hidden { display: none; }

    .item-card img,
    .item-img-placeholder {
      width: 44px;
      height: 44px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .item-img-placeholder { background: var(--border); border-radius: 4px; }

    .item-name {
      flex: 1;
      font-size: 9px;
      color: var(--subtext);
      text-align: center;
      line-height: 1.3;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      width: 100%;
    }
    .unlisted-badge { font-size: 8px; color: var(--muted); display: block; }

    .item-card input[type="number"] {
      width: 100%;
      padding: 3px 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      text-align: center;
      outline: none;
      -moz-appearance: textfield;
      appearance: textfield;
    }
    .item-card input[type="number"]::-webkit-outer-spin-button,
    .item-card input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
    .item-card input[type="number"]:focus { border-color: var(--accent); }
    .item-card input[type="number"].nonzero { border-color: var(--green); color: var(--green); }
    .view-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      flex-shrink: 0;
    }

    /* ── Compare bar ── */
    .compare-bar {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .compare-chips {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 140px;
      overflow-y: auto;
    }
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }
    .stockpile-chip {
      padding: 3px 9px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--subtext);
      font-size: 11px;
      cursor: pointer;
      transition: border-color 0.1s, color 0.1s;
      white-space: nowrap;
    }
    .stockpile-chip.active  { border-color: var(--green); color: var(--green); }
    .stockpile-chip.partial { border-color: var(--green); color: var(--subtext); border-style: dashed; }
    .stockpile-chip:hover   { opacity: 0.8; }
    .stockpile-chip.region-chip { font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; }
    .stockpile-chip.region-chip.active  { background: rgba(215,169,63,0.10); }
    .stockpile-chip.region-chip.partial { background: rgba(215,169,63,0.05); }
    .chip-del { margin-left: 5px; opacity: 0.45; font-size: 12px; line-height: 1; vertical-align: middle; }
    .chip-del:hover { opacity: 1; color: var(--red); }


    .item-card.compare-done { border-color: var(--green); opacity: 0.45; }
    .cmp-done { color: var(--green); }
    .cmp-need { color: var(--red);   }
  </style>
</head>
<body>
  <div id="app"><p class="loading">Loading…</p></div>

  <script>
    // ─── State ───────────────────────────────────────────────────────────────
    var currentMode      = null;
    var existingKeys     = [];
    var currentStockpile = null;
    var allItems         = [];
    var allCategories    = [];
    var selectedCategory = ['All'];
    var currentScale = 1;
    var editMaps = [];
    var storageTypes = [];
    var storageTypeAliases = {};
    var currentMapData = null;
    var currentMapIsNew = false;
    var currentDefaultIcons = {};
    var currentDefaultRouteLineId = '';
    var currentMapStockpiles = [];
    var currentMapRoutes = [];
    var pendingSelectionTarget = null;
    var visibleFields    = [];
    var exportStockpiles = [];
    var exportMaps = [];
    var viewItems       = {};
    var viewStockpiles  = [];
    var viewShowPassword = false;
    var currentTitle = '';
    var currentRequest     = null;
    var addRequestViewStock = false;
    var selectedRefCategory = 'All';
    var currentViewRequest = null;
    var allStockpiles       = [];
    var selectedStockpileIds = {};

    // ─── Widget → iframe ──────────────────────────────────────────────────────
    window.onmessage = function(event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'selection-id') {
        if (pendingSelectionTarget && pendingSelectionTarget.selector) {
          var targetEl = document.querySelector(pendingSelectionTarget.selector);
          if (targetEl) targetEl.value = msg.nodeId;
        } else if (pendingSelectionTarget && pendingSelectionTarget.sectionId && pendingSelectionTarget.type) {
          var rows = document.querySelectorAll('#' + pendingSelectionTarget.sectionId + ' .icon-row');
          rows.forEach(function(row) {
            if (row.getAttribute('data-type') !== pendingSelectionTarget.type) return;
            var inp = row.querySelector('.icon-input');
            if (inp) inp.value = msg.nodeId;
          });
        }
        pendingSelectionTarget = null;
        return;
      }
      currentMode = msg.mode;

      if (currentMode === 'add') {
        existingKeys        = msg.existingKeys || [];
        allItems            = msg.allItems     || [];
        storageTypeAliases  = msg.storageTypeAliases || {};
        renderAdd();
      } else if (currentMode === 'edit') {
        currentStockpile = msg.stockpile;
        allItems         = msg.allItems || [];
        allCategories    = msg.allCategories || [];
        selectedCategory = ['All'];
        renderEdit();
      } else if (currentMode === 'config') {
        allItems      = msg.allItems || [];
        visibleFields = msg.visibleFields || [];
        renderConfig();
      } else if (currentMode === 'export') {
        exportStockpiles = msg.stockpiles || [];
        exportMaps       = msg.maps       || [];
        renderExport();
      } else if (currentMode === 'view') {
        viewItems        = msg.items         || {};
        viewStockpiles   = msg.stockpiles    || [];
        viewShowPassword = !!msg.showPassword;
        currentTitle     = msg.title         || '';
        allItems         = msg.allItems      || [];
        allCategories    = msg.allCategories || [];
        selectedCategory = ['All'];
        renderView();
      }  else if (currentMode === 'import') {
        renderImport();
      } else if (currentMode === 'discord') {
        storageTypeAliases = msg.storageTypeAliases || {};
        renderDiscordImport();
      } else if (currentMode === 'viewrequest') {
        currentViewRequest   = msg.request       || {};
        allStockpiles        = msg.allStockpiles || [];
        allItems             = msg.allItems      || [];
        allCategories        = msg.allCategories || [];
        selectedCategory     = ['All'];
        selectedStockpileIds = {};
        renderViewRequest();
      } else if (currentMode === 'mapdetail') {
        storageTypes         = msg.storageTypes  || [];
        currentMapIsNew      = !!msg.isNew;
        currentMapStockpiles = msg.allStockpiles || [];
        currentDefaultRouteLineId = msg.defaultRouteLineId || '';
        var srcMap           = msg.map || {};
        currentMapData       = Object.assign({ icons: {}, routes: [] }, srcMap, { icons: Object.assign({}, srcMap.icons || {}) });
        currentMapRoutes     = (srcMap.routes || []).map(function(r) {
          return Object.assign({}, r, { routeLineId: r.routeLineId || srcMap.routeLineId || currentDefaultRouteLineId || '' });
        });
        renderMapDetail();
      } else if (currentMode === 'settings') {
        currentScale        = msg.scale        || 1;
        currentDefaultIcons = Object.assign({}, msg.defaultIcons || {});
        currentDefaultRouteLineId = msg.defaultRouteLineId || '';
        storageTypes        = msg.storageTypes || [];
        renderSettings();
      } else if (currentMode === 'maps') {
        editMaps     = (msg.maps || []).map(function(m) { return Object.assign({ icons: {} }, m, { icons: Object.assign({}, m.icons || {}) }); });
        storageTypes = msg.storageTypes || [];
        renderMaps();
      } else if (currentMode === 'resize') {
        currentScale = msg.currentScale || 1;
        renderResize();
      } else if (currentMode === 'addrequest') {
        allItems         = msg.allItems      || [];
        allCategories    = msg.allCategories || [];
        allStockpiles    = msg.allStockpiles || [];
        selectedCategory = ['All'];
        currentRequest   = { id: uid(), name: '', description: '', items: {}, createdAt: 0, createdBy: '' };
        renderAddRequest();
      }
    };

    function send(data) {
      parent.postMessage({ pluginMessage: data }, '*');
    }

    function pickSelectionInto(selector) {
      pendingSelectionTarget = { selector: selector };
      send({ type: 'get-selection' });
    }

    function pickSelectionIntoIcon(sectionId, type) {
      pendingSelectionTarget = { sectionId: sectionId, type: type };
      send({ type: 'get-selection' });
    }

    document.addEventListener('dblclick', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      var card = e.target.closest('.item-card');
      if (!card) return;
      var nameEl = card.querySelector('.item-name');
      if (!nameEl) return;
      var name = normKey(nameEl.textContent.replace(/ \(Crate\)$/, '').replace(/\(unlisted\)$/, '').trim());
      var url = '';
      for (var i = 0; i < allItems.length; i++) {
        if (normKey(allItems[i].name) === name) {
          url = allItems[i].wikiUrl || '';
          break;
        }
      }
      if (!url) return;
      send({ type: 'open-url', url: url });
    });

    // =========================================================================
    // ADD MODE
    // =========================================================================

    function renderAdd() {
      document.getElementById('app').innerHTML = [
        '<div class="add-wrapper">',

    function parseFIRHeader(line) {
      line = (line || '').trim();
      var lastComma = line.lastIndexOf(',');
      var pathPart  = lastComma >= 0 ? line.substring(0, lastComma).trim() : line;
      var datePart  = lastComma >= 0 ? line.substring(lastComma + 1).trim() : '';
      var parts     = pathPart.split(' - ');
      if (parts.length < 4) return null;
      var region    = parts[0].trim();
      var hex       = parts[1].trim();
      var structure = normalizeStorageType(parts[2].trim());
      var code      = parts.slice(3).join(' - ').trim();
      if (!region || !hex || !structure || !code) return null;
      // Extract optional coordinates: "... - X: 0.1722732 Y: 0.4367275"
      var x = null, y = null;
      var coordMatch = code.match(/ - X: ([\d.]+) Y: ([\d.]+)$/);
      if (coordMatch) {
        x = parseFloat(coordMatch[1]);
        y = parseFloat(coordMatch[2]);
        code = code.slice(0, code.length - coordMatch[0].length).trim();
      }
      // Parse "2026.05.17-10.40.28"
      var ts = 0;
      var m  = datePart.match(/^(\d{4})\.(\d{2})\.(\d{2})-(\d{2})\.(\d{2})\.(\d{2})$/);
      if (m) {
        ts = new Date(
          parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]),
          parseInt(m[4]), parseInt(m[5]), parseInt(m[6])
        ).getTime();
      }
      return { region: region, hex: hex, structure: structure, code: code, x: x, y: y, ts: ts };
    }

    function normalizeStorageType(value) {
      var raw = (value || '').trim();
      if (!raw) return raw;
      if (storageTypeAliases[raw]) return storageTypeAliases[raw];
      var lower = raw.toLocaleLowerCase();
      for (var alias in storageTypeAliases) {
        if (alias.toLocaleLowerCase() === lower) return storageTypeAliases[alias];
      }
      return raw;
    }

          return;

        var nonzero  = Object.keys(items).filter(function(k) { return items[k] > 0; }).length;
        var nodeKey  = header.region + '|' + header.hex + '|' + header.structure + '|' + header.code;

          structure: header.structure, code: header.code,

    function buildItemsGrid() {
      var sp = currentStockpile;

      var catByName = {};
      var imgByName = {};
      allItems.forEach(function(item) {
        var k = normKey(item.name);
        catByName[k] = item.category;
        imgByName[k] = item.imgUrl || '';
      });

      var renderedExtras = {};
      var html = '';

      // Catalog items: only those with count > 0; render crate sibling right after
      allItems.forEach(function(item) {
        var key = normKey(item.name);
        var cat = item.category;
        if (cat === 'Vehicles' || cat === 'Shippable Structures') {
          var nonCrateCat = cat === 'Vehicles' ? 'Vehicles Non-Crate' : 'Shippable Structures Non-Crate';
          var count = sp.items[key] !== undefined ? sp.items[key] : (sp.items[item.name] || 0);
          if (count > 0) html += makeItemCard(key, item.imgUrl, count, nonCrateCat, false);
          var crateKey   = key + ' (Crate)';
          var crateCount = sp.items[crateKey];
          if (crateCount !== undefined && crateCount > 0) {
            html += makeItemCard(crateKey, item.imgUrl, crateCount, cat, false);
            renderedExtras[crateKey] = true;
          }
        } else {
          var count = sp.items[key] !== undefined ? sp.items[key] : (sp.items[item.name] || 0);
          if (count > 0) html += makeItemCard(key, item.imgUrl, count, cat, false);
        }
      });

      // Truly unlisted extras
      Object.keys(sp.items).forEach(function(storedName) {
        if (catByName[normKey(storedName)]) return;
        if (renderedExtras[storedName])     return;
        var count = sp.items[storedName] || 0;

             imgTag +
             '<span class="item-name">' + esc(name) + extra + '</span>'+
             '<input type="number" min="0" placeholder="0" data-item-name="' + esc(name) + '" value="' + esc(String(inputVal)) + '"' + inputCls + '>'+

    function mountDiscordImport() {
      var ta = document.getElementById('discordInput');
      var importBtn = document.getElementById('importBtn');

      var errorEl = document.getElementById('discordError');
      var parsed = null;

        importBtn.disabled = parsed.stockpiles.length === 0;

    function parseDiscordStockpiles(text) {
      var rows = [];
      var current = { region: '', hex: '', structure: '' };
      var lines = String(text || '').split('\n');
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line || line.charAt(0) !== '|') continue;
        if (/^\|[\s:\-|\u2014]+\|?$/.test(line)) continue;
        var cells = line.split('|').slice(1, -1).map(function(cell) { return cell.trim(); });
        if (cells.length < 3) continue;
        if (/регіон|region/i.test(cells[0])) continue;

        var region = '';
        var hex = '';
        var structure = '';
        var code = '';
        var password = '';

        if (cells.length >= 5) {
          region = cells[0] || current.region;
          hex = cells[1] || current.hex;
          structure = cells[2] || current.structure;
          code = cells[3];
          password = cells[4];
        } else {
          region = current.region;
          hex = current.hex;
          structure = current.structure;
          code = cells[cells.length - 2];
          password = cells[cells.length - 1];
        }

        structure = normalizeStorageType(structure);
        password = String(password || '').replace(/\D/g, '');
        if (!region || !hex || !structure || !code) continue;
        current = { region: region, hex: hex, structure: structure };
        rows.push({
          id: uid(),
          region: region,
          hex: hex,
          structure: structure,
          code: code,
          password: password || undefined,
          items: {},
          lastUpdated: 0,
          lastEditedBy: '',
        });
      }
      return { stockpiles: rows };
    }

        // =========================================================================
    // FIR PARSER
    // =========================================================================

    // Parses "/stockpile copy" clipboard format.
    // First line is metadata (stockpile path + date) — skipped.
    // Each subsequent non-empty line: <name>,<count>
    // The LAST comma separates name from count (names can contain commas).
    function parseFIR(rawText) {
      var catByName = {};
      var itemAliasByName = {};
      allItems.forEach(function(item) {
        var itemName = normKey(item.name);
        catByName[itemName] = item.category;
        itemAliasByName[itemName] = itemName;
        if (item.nameRus) itemAliasByName[normKey(item.nameRus)] = itemName;
      });

      var lines  = rawText.trim().split('\n');
      var result = {};
      for (var i = 1; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        var lastComma = line.lastIndexOf(',');
        if (lastComma < 0) continue;
        var name     = normalizeItemName(line.substring(0, lastComma).trim(), itemAliasByName);
        var countStr = line.substring(lastComma + 1).trim();
        var count    = parseInt(countStr, 10);
        if (!name || isNaN(count) || count <= 0) continue;

        var hasCrate = name.length > 8 && name.slice(-8) === ' (Crate)';
        if (hasCrate) {
          var base = name.slice(0, -8);
          var cat  = catByName[base];
          if (cat === 'Vehicles' || cat === 'Shippable Structures') {
            result[name] = count;
          } else {
            result[base] = count;
          }
        } else {
          result[name] = count;
        }
      }
      return result;
    }

    function normalizeItemName(value, itemAliasByName) {
      var name = normKey(value);
      var crateSuffix = ' (Crate)';
      var hasCrate = name.length > crateSuffix.length && name.slice(-crateSuffix.length) === crateSuffix;
      var base = hasCrate ? name.slice(0, -crateSuffix.length) : name;
      var canonicalBase = itemAliasByName[base] || base;
      return hasCrate ? canonicalBase + crateSuffix : canonicalBase;
    }

    // Flush current table inputs back into currentStockpile.items (in memory).
    // Called before applyFIR so manual edits are preserved under FIR data.
    function collectCurrentInputs() {
      var inputs = document.querySelectorAll('#itemsTbody input[data-item-name]');
      inputs.forEach(function(inp) {
        var name  = inp.getAttribute('data-item-name');
        var count = parseInt(inp.value) || 0;
        if (count > 0) currentStockpile.items[name] = count;
        else           delete currentStockpile.items[name];
      });
    }

    // Apply parsed FIR data: merge into currentStockpile.items, rebuild table.
    // Returns number of lines processed.
    function applyFIR(text) {
      collectCurrentInputs();
      var parsed = parseFIR(text);
      var n = 0;
      for (var name in parsed) {
        var count = parsed[name];
        if (count > 0) currentStockpile.items[name] = count;
        else           delete currentStockpile.items[name];
        n++;
      }
      buildTable();
      return n;
    }

    function countNonzero() {
      var inputs = document.querySelectorAll('#itemsTbody input[data-item-name]');
      var n = 0;
      inputs.forEach(function(inp) { if ((parseInt(inp.value) || 0) > 0) n++; });
      return n;
    }

    function groupStockpilesByRegion(stockpiles) {
      var groups = {};
      var order  = [];
      stockpiles.forEach(function(sp) {
        if (!groups[sp.region]) { groups[sp.region] = []; order.push(sp.region); }
        groups[sp.region].push(sp);
      });
      return { groups: groups, order: order };
    }

    function toggleRegion(region) {
      var sps = allStockpiles.filter(function(sp) { return sp.region === region; });
      var allSel = sps.every(function(sp) { return selectedStockpileIds[sp.id]; });
      sps.forEach(function(sp) { selectedStockpileIds[sp.id] = !allSel; });
    }

    function buildGroupedChips(containerId) {
      var container = document.getElementById(containerId);
      if (!container) return;
      if (allStockpiles.length === 0) {
        container.innerHTML = '<span style="font-size:11px;color:var(--muted)">No stockpiles added yet</span>';
        return;
      }
      var grouped = groupStockpilesByRegion(allStockpiles);
      var html = '';
      grouped.order.forEach(function(region) {
        var sps = grouped.groups[region];
        var selCount = sps.filter(function(sp) { return selectedStockpileIds[sp.id]; }).length;
        var regionCls = selCount === sps.length ? ' active' : (selCount > 0 ? ' partial' : '');
        html += '<div class="chip-group">';
        html += '<button class="stockpile-chip region-chip' + regionCls + '" data-region="' + esc(region) + '">' + esc(region) + '</button>';
        sps.forEach(function(sp) {
          var active = selectedStockpileIds[sp.id] ? ' active' : '';
          var title  = esc(sp.region + ' › ' + sp.hex + ' › ' + sp.structure + ' › ' + sp.code);
          html += '<button class="stockpile-chip' + active + '" data-id="' + esc(sp.id) + '" title="' + title + '">' + esc(sp.code) + '</button>';
        });
        html += '</div>';
      });
      container.innerHTML = html;
    }

    function buildCompareChips() { buildGroupedChips('compareChips'); }


    function buildCompareGrid() {
      var covered     = {};
      var anySelected = false;
      allStockpiles.forEach(function(sp) {
        if (!selectedStockpileIds[sp.id]) return;
        anySelected = true;
        var items = sp.items || {};
        Object.keys(items).forEach(function(k) {
          covered[k] = (covered[k] || 0) + (items[k] || 0);
        });
      });

      var catByName = {};
      allItems.forEach(function(item) { catByName[normKey(item.name)] = item.category; });

      var renderedExtras = {};
      var html = '';
      var req  = currentViewRequest;

      allItems.forEach(function(item) {
        var key = normKey(item.name);
        var cat = item.category;
        if (cat === 'Vehicles' || cat === 'Shippable Structures') {
          var nonCrateCat = cat === 'Vehicles' ? 'Vehicles Non-Crate' : 'Shippable Structures Non-Crate';
          var requested = req.items[key] !== undefined ? req.items[key] : (req.items[item.name] || 0);
          if (requested > 0) {
            html += makeCompareCard(key, item.imgUrl, requested, covered[key] || 0, nonCrateCat, anySelected);
          }
          var crateKey = key + ' (Crate)';
          var reqCrate = req.items[crateKey];
          if (reqCrate !== undefined && reqCrate > 0) {
            html += makeCompareCard(crateKey, item.imgUrl, reqCrate, covered[crateKey] || 0, cat, anySelected);
            renderedExtras[crateKey] = true;
          }
        } else {
          var requested = req.items[key] !== undefined ? req.items[key] : (req.items[item.name] || 0);
          if (requested > 0) {
            html += makeCompareCard(key, item.imgUrl, requested, covered[key] || 0, cat, anySelected);
          }
        }
      });

      Object.keys(req.items).forEach(function(storedName) {
        if (catByName[normKey(storedName)]) return;
        if (renderedExtras[storedName])     return;
        var requested = req.items[storedName] || 0;
        if (requested <= 0) return;
        html += makeCompareCard(storedName, '', requested, covered[storedName] || 0, 'All', anySelected);
      });

      document.getElementById('itemsGrid').innerHTML = html;
      filterItems();
    }

    function makeCompareCard(name, imgUrl, requested, covered, category, anySelected) {
      var imgTag = imgUrl
        ? '<img src="' + esc(imgUrl) + '" alt="" loading="lazy">'
        : '<div class="item-img-placeholder"></div>';
      if (!anySelected) {
        return '<div class="item-card" data-cat="' + esc(category) + '">' +
               imgTag +
               '<span class="item-name">' + esc(name) + '</span>' +
               '<span class="view-count">' + requested + '</span>' +
               '</div>';
      }
      var remaining = Math.max(0, requested - covered);
      var done    = remaining === 0;
      var cardCls = done ? ' compare-done' : '';
      var cntCls  = done ? ' cmp-done'     : ' cmp-need';
      return '<div class="item-card' + cardCls + '" data-cat="' + esc(category) + '">' +
             imgTag +
             '<span class="item-name">' + esc(name) + '</span>' +
             '<span class="view-count' + cntCls + '">' + remaining + '</span>' +
             '</div>';
    }

    function mountViewRequest() {
      var catBar      = document.getElementById('catBar');
      var chips       = document.getElementById('compareChips');
      var selAll      = document.getElementById('selAllBtn');
      var selNone     = document.getElementById('selNoneBtn');

          var chip = e.target.closest('.stockpile-chip');

          var region = chip.getAttribute('data-region');
          if (region) { toggleRegion(region); buildCompareChips(); buildCompareGrid(); return; }
          var id = chip.getAttribute('data-id');
          if (!id) return;
          selectedStockpileIds[id] = !selectedStockpileIds[id];
          buildCompareChips();
          buildCompareGrid();
        });
      }

      if (selAll) {
        selAll.addEventListener('click', function() {
          allStockpiles.forEach(function(sp) { selectedStockpileIds[sp.id] = true; });
          buildCompareChips();
          buildCompareGrid();
        });
      }

      if (selNone) {
        selNone.addEventListener('click', function() {
          selectedStockpileIds = {};
          buildCompareChips();
          buildCompareGrid();
        });
      }

      catBar.addEventListener('click', function(e) {
        var btn = e.target.closest('.cat-btn');
        if (!btn) return;
        toggleCategory(btn.getAttribute('data-cat'));
        catBar.querySelectorAll('.cat-btn').forEach(function(b) {
          b.classList.toggle('active', selectedCategory.indexOf(b.getAttribute('data-cat')) !== -1);
        });
        filterItems();
      });

      closeBtn.addEventListener('click', function() { send({ type: 'close' }); });

      closeReqBtn.addEventListener('click', function() {
        send({ type: 'close-request', id: currentViewRequest.id });
      });
    }

        collectRequestInputs();
        buildStockRefGrid();

    function buildStockRefGrid() {
      var totalStock = {};
      allStockpiles.forEach(function(sp) {
        var items = sp.items || {};
        Object.keys(items).forEach(function(k) {
          totalStock[k] = (totalStock[k] || 0) + (items[k] || 0);
        });
      });

      if (Object.keys(totalStock).length === 0) {
        document.getElementById('itemsGrid').innerHTML =
          '<p style="color:var(--muted);font-size:12px;padding:20px;text-align:center">No stockpiles added yet</p>';
        return;
      }

      var catByName = {};
      allItems.forEach(function(item) { catByName[normKey(item.name)] = item.category; });

      var renderedExtras = {};
      var html = '';

      allItems.forEach(function(item) {
        var key = normKey(item.name);
        var cat = item.category;
        if (cat === 'Vehicles' || cat === 'Shippable Structures') {
          var nonCrateCat = cat === 'Vehicles' ? 'Vehicles Non-Crate' : 'Shippable Structures Non-Crate';
          var count = totalStock[key] || 0;
          if (count > 0) html += makeViewCard(key, item.imgUrl, count, nonCrateCat);
          var crateKey   = key + ' (Crate)';
          var crateCount = totalStock[crateKey] || 0;
          if (crateCount > 0) {
            html += makeViewCard(crateKey, item.imgUrl, crateCount, cat);
            renderedExtras[crateKey] = true;
          }
        } else {
          var count = totalStock[key] || 0;
          if (count > 0) html += makeViewCard(key, item.imgUrl, count, cat);
        }
      });

      Object.keys(totalStock).forEach(function(storedName) {
        if (catByName[normKey(storedName)]) return;
        if (renderedExtras[storedName])     return;
        var count = totalStock[storedName] || 0;
        if (count <= 0) return;
        html += makeViewCard(storedName, '', count, 'All');
      });

      document.getElementById('itemsGrid').innerHTML = html;
      filterItems();
    }

    function mountAddRequest() {

      var catBar         = document.getElementById('catBar');

      var reqDesc        = document.getElementById('reqDesc');

      var toggleStockBtn = document.getElementById('toggleStockBtn');

      if (toggleReqBtn) {
        toggleReqBtn.addEventListener('click', function() {
          if (addRequestViewStock) toggleRequestStockView(false);
        });
      }
      if (toggleStockBtn) {
        toggleStockBtn.addEventListener('click', function() {
          if (!addRequestViewStock) toggleRequestStockView(true);
        });
      }

      setTimeout(function() { reqName.focus(); }, 0);

      reqName.addEventListener('input', function() {
        saveBtn.disabled = reqName.value.trim() === '';
      });

      catBar.addEventListener('click', function(e) {
        var btn = e.target.closest('.cat-btn');
        if (!btn) return;
        selectedCategory = btn.getAttribute('data-cat');

          b.classList.toggle('active', b.getAttribute('data-cat') === selectedCategory);
        });
        filterItems();
      });

          var count = parseInt(inp.value) || 0;
          if (count > 0) items[inp.getAttribute('data-item-name')] = count;
        });
        send({ type: 'save', mode: 'addrequest', payload: {
          id:          uid(),
          name:        name,
          description: reqDesc.value.trim(),

          createdAt:   Date.now(),

      var refSelAll2  = document.getElementById('refSelAllBtn');

          var id = chip.getAttribute('data-id');
          if (!id) return;
          selectedStockpileIds[id] = !selectedStockpileIds[id];
          buildRefChips();
          buildRefGrid();
        });
      }
      if (refSelAll2) {
        refSelAll2.addEventListener('click', function() {
          allStockpiles.forEach(function(sp) { selectedStockpileIds[sp.id] = true; });
          buildRefChips();
          buildRefGrid();
        });
      }
      if (refSelNone2) {
        refSelNone2.addEventListener('click', function() {
          selectedStockpileIds = {};
          buildRefChips();
          buildRefGrid();
        });
      }
    }


    function buildRefCatBar() {
      var bar = document.getElementById('refCatBar');
      if (!bar) return;
      bar.innerHTML = allCategories.map(function(cat) {
        var active = cat.name === selectedRefCategory ? ' active' : '';
        return '<button class="cat-btn' + active + '" data-cat="' + esc(cat.name) + '" title="' + esc(cat.name) + '">' +
               '<img src="' + esc(cat.imgUrl) + '" alt="" loading="lazy"></button>';
      }).join('');
    }

    function buildRefChips() { buildGroupedChips('refChips'); }

    function buildRefGrid() {
      var refItems = {};
      var anySelected = Object.keys(selectedStockpileIds).some(function(id) { return selectedStockpileIds[id]; });
      if (anySelected) {
        allStockpiles.forEach(function(sp) {
          if (!selectedStockpileIds[sp.id]) return;
          var items = sp.items || {};
          Object.keys(items).forEach(function(k) {
            refItems[k] = (refItems[k] || 0) + (items[k] || 0);
          });
        });
      }
      var catByName = {};
      allItems.forEach(function(item) { catByName[normKey(item.name)] = item.category; });
      var renderedExtras = {};
      var html = '';
      allItems.forEach(function(item) {
        var key = normKey(item.name);
        var cat = item.category;
        if (cat === 'Vehicles' || cat === 'Shippable Structures') {
          var nonCrateCat = cat === 'Vehicles' ? 'Vehicles Non-Crate' : 'Shippable Structures Non-Crate';
          var count = refItems[key] || 0;
          if (count > 0) html += makeViewCard(key, item.imgUrl, count, nonCrateCat);
          var crateKey   = key + ' (Crate)';
          var crateCount = refItems[crateKey] || 0;
          if (crateCount > 0) {
            html += makeViewCard(crateKey, item.imgUrl, crateCount, cat);
            renderedExtras[crateKey] = true;
          }
        } else {
          var count = refItems[key] || 0;
          if (count > 0) html += makeViewCard(key, item.imgUrl, count, cat);
        }
      });
      Object.keys(refItems).forEach(function(storedName) {
        if (catByName[normKey(storedName)]) return;
        if (renderedExtras[storedName])     return;
        var count = refItems[storedName] || 0;
        if (count <= 0) return;
        html += makeViewCard(storedName, '', count, 'All');
      });
      var el = document.getElementById('refItemsGrid');
      if (!el) return;
      el.innerHTML = html || '<p style="color:var(--muted);font-size:12px;padding:20px;text-align:center">' + (anySelected ? 'No items in selected stockpiles' : 'Select stockpiles above to compare') + '</p>';
      filterItems();
    }

    function filterRefItems() {
      document.querySelectorAll('#refItemsGrid .item-card').forEach(function(card) {
        var cat = card.getAttribute('data-cat');
        if (selectedRefCategory === 'All' || cat === selectedRefCategory) card.classList.remove('hidden');
        else card.classList.add('hidden');
      });
    }

        var v = (icons || {})[t] || '';

    function missingIconTypes(icons) {
      return storageTypes.filter(function(t) { return !(icons || {})[t]; });

    function missingIconsWarningHtml(icons, prefix) {
      var missing = missingIconTypes(icons);
      if (missing.length === 0) return '';
      return '<div class="error-msg" style="min-height:auto;margin-top:6px;color:var(--red)">' +

    function buildRouteRowHtml(idx, route) {
      var selectStyle = 'flex:1;padding:5px 8px;background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;font-family:inherit;outline:none;min-width:0';

      var fromOpts = '<option value="">— Виберіть склад —</option>' + currentMapStockpiles.map(function(s) {

      }).join('');
      var toOpts = '<option value="">— Виберіть склад —</option>' + currentMapStockpiles.map(function(s) {
        var disabled = route.fromId === s.id ? ' disabled' : '';
        var sel = route.toId === s.id ? ' selected' : '';

        '<div style="display:flex;align-items:center;gap:6px">' +
          '<select class="route-from" data-idx="' + idx + '" style="' + selectStyle + '">' + fromOpts + '</select>' +
          '<span style="color:var(--subtext);font-size:14px;flex-shrink:0">→</span>' +
          '<select class="route-to" data-idx="' + idx + '" style="' + selectStyle + '">' + toOpts + '</select>' +
          '<button class="btn-sm btn-danger route-del-btn" data-idx="' + idx + '" title="Видалити">✕</button>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:6px;margin-top:6px">' +
          '<span style="font-size:10px;color:var(--subtext);width:62px;flex-shrink:0">Line</span>' +
          '<input class="route-line" data-idx="' + idx + '" value="' + esc(route.routeLineId || '') + '" placeholder="Figma link / node-id" style="' + inputStyle + '">' +
          '<button class="btn-sm btn-secondary route-line-sel-btn" data-idx="' + idx + '" title="З виділення">⊡</button>' +

    function collectRoutesFromDOM() {
      document.querySelectorAll('#mdRoutesSection .route-row').forEach(function(row) {
        var idx = parseInt(row.getAttribute('data-idx'));
        if (isNaN(idx) || idx < 0 || idx >= currentMapRoutes.length) return;
        var fromEl = row.querySelector('.route-from');
        var toEl = row.querySelector('.route-to');
        var lineEl = row.querySelector('.route-line');
        if (fromEl) currentMapRoutes[idx].fromId = fromEl.value;
        if (toEl) currentMapRoutes[idx].toId = toEl.value;
        if (lineEl) currentMapRoutes[idx].routeLineId = lineEl.value.trim();
      });
    }

    function rebuildRoutesSection() {
      var el = document.getElementById('mdRoutesSection');
      if (!el) return;
      var html = currentMapRoutes.length === 0
        ? '<p style="color:var(--subtext);font-size:11px;padding:4px 0">Маршрутів немає. Натисни «+ Add route».</p>'
        : currentMapRoutes.map(function(r, i) { return buildRouteRowHtml(i, r); }).join('');
      el.innerHTML = html;

      el.querySelectorAll('.route-from').forEach(function(sel) {
        sel.addEventListener('change', function() {
          var idx = parseInt(sel.getAttribute('data-idx'));
          currentMapRoutes[idx].fromId = sel.value;
          if (currentMapRoutes[idx].fromId === currentMapRoutes[idx].toId) currentMapRoutes[idx].toId = '';
          rebuildRoutesSection();
        });
      });
      el.querySelectorAll('.route-to').forEach(function(sel) {
        sel.addEventListener('change', function() {
          var idx = parseInt(sel.getAttribute('data-idx'));
          if (sel.value === currentMapRoutes[idx].fromId) { sel.value = ''; return; }
          currentMapRoutes[idx].toId = sel.value;
        });
      });
      el.querySelectorAll('.route-del-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          collectRoutesFromDOM();
          var idx = parseInt(btn.getAttribute('data-idx'));
          currentMapRoutes.splice(idx, 1);
          rebuildRoutesSection();
        });
      });
      el.querySelectorAll('.route-line-sel-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          collectRoutesFromDOM();
          pickSelectionInto('#mdRoutesSection .route-row[data-idx="' + btn.getAttribute('data-idx') + '"] .route-line');
        });
      });
    }

      var cancelBtn = document.getElementById('mdCancelBtn');

      rebuildRoutesSection();

          rebuildRoutesSection();

      saveBtn.addEventListener('click', function() {

          var r = currentMapRoutes[i];
          if (!r.fromId || !r.toId) { errorEl.textContent = 'Маршрут #' + (i+1) + ': виберіть обидва склади.'; return; }

    function parseFigmaNodeId(input) {
      if (!input) return null;
      var s = input.trim();
      var urlMatch = s.match(/[?&]node-id=([0-9A-Za-z%-]+)/);
      if (urlMatch) return decodeURIComponent(urlMatch[1]).replace('-', ':');
      if (/^[0-9]+-[0-9]+$/.test(s)) return s.replace('-', ':');
      if (/^[0-9]+:[0-9]+$/.test(s)) return s;
      return null;
    }

    function renderMaps() {
      document.getElementById('app').innerHTML =
        '<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">' +
          '<div style="padding:12px 16px 8px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:8px">' +
            '<span style="font-size:13px;font-weight:600;color:var(--accent);flex:1">Map Overlays</span>' +
            '<button class="btn-sm btn-primary" id="addMapBtn">+ Add map</button>' +
          '</div>' +
          '<div id="mapsListEl" style="flex:1;overflow-y:auto;padding:8px 16px"></div>' +
          '<div class="buttons">' +
            '<button class="btn-secondary" id="cancelMapsBtn">Cancel</button>' +
            '<button class="btn-primary" id="saveMapsBtn">Save &amp; Redraw</button>' +
          '</div>' +
        '</div>';

      rebuildMapsList();

      document.getElementById('addMapBtn').addEventListener('click', function() {
        editMaps.push({ id: uid(), name: 'Map ' + (editMaps.length + 1), nodeId: '', icons: {} });
        rebuildMapsList();
      });

      document.getElementById('cancelMapsBtn').addEventListener('click', function() {
        send({ type: 'close' });
      });

      document.getElementById('saveMapsBtn').addEventListener('click', function() {
        collectMapsFromDOM();
        var invalid = editMaps.filter(function(m) { return !parseFigmaNodeId(m.nodeId); });
        if (invalid.length > 0) {
          alert('Деякі карти мають невалідний node-id: ' + invalid.map(function(m){ return m.name; }).join(', '));
          return;
        }
        send({ type: 'save-maps', maps: editMaps });
      });

      window.addEventListener('message', function(ev) {
        var msg = ev.data && ev.data.pluginMessage;
        if (!msg || msg.type !== 'selection-id') return;
        var el = document.getElementById('mapsListEl');
        if (!el) return;
        var pending = (el.getAttribute('data-pending-sel') || '').split(':');
        var idx = parseInt(pending[0]);
        if (isNaN(idx) || idx < 0 || idx >= editMaps.length) return;
        if (pending[1] === 'icon') {
          var t = decodeURIComponent(pending.slice(2).join(':'));
          editMaps[idx].icons = editMaps[idx].icons || {};
          editMaps[idx].icons[t] = msg.nodeId;
        } else {
          editMaps[idx].nodeId = msg.nodeId;
        }
        el.setAttribute('data-pending-sel', '');
        rebuildMapsList();
      });
    }

    function collectMapsFromDOM() {
      var rows = document.querySelectorAll('#mapsListEl .map-row');
      rows.forEach(function(row) {
        var idx = parseInt(row.getAttribute('data-idx'));
        if (isNaN(idx) || idx < 0 || idx >= editMaps.length) return;
        editMaps[idx].name = row.querySelector('.map-name').value || editMaps[idx].name;
        var raw    = row.querySelector('.map-nodeid').value.trim();
        var parsed = parseFigmaNodeId(raw);
        if (parsed) editMaps[idx].nodeId = parsed;
        editMaps[idx].icons = editMaps[idx].icons || {};
        row.querySelectorAll('.icon-row').forEach(function(iconRow) {
          var t   = iconRow.getAttribute('data-type');
          var inp = iconRow.querySelector('.icon-input');
          if (!t || !inp) return;
          var v = parseFigmaNodeId(inp.value.trim());
          if (v) editMaps[idx].icons[t] = v;
        });
      });

          '<div style="display:flex;align-items:center;gap:6px">' +
            '<input class="map-nodeid" value="' + esc(m.nodeId || '') + '" placeholder="Figma link або node-id" ' +

            '<button class="btn-sm btn-secondary map-sel-btn" data-idx="' + i + '" title="З виділення">⊡</button>' +
          '</div>' +
          '<div style="margin-top:4px;margin-bottom:6px">' + nodeLabel + '</div>' +

      el.querySelectorAll('.map-sel-btn').forEach(function(btn) {

      el.querySelectorAll('.map-del-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {

          '<div class="field">',
            '<label>Scale</label>',
            '<input id="stScale" type="number" min="0.1" max="200" step="0.1" value="' + currentScale + '" ',
              'style="width:100%;padding:8px 10px;background:var(--surface);border:1px solid var(--border);',
              'border-radius:6px;color:var(--text);font-size:16px;font-family:inherit;text-align:center;outline:none;',
              '-moz-appearance:textfield;appearance:textfield">',
            '<div id="stScalePreview" style="margin-top:5px;font-size:11px;color:var(--subtext);text-align:center">',
              'Основний текст: 16 × ' + currentScale + ' = ' + Math.round(16 * currentScale) + 'px',
            '</div>',
          '</div>',
          '<div class="field" style="margin-top:14px">',
            '<label>Default Icons</label>',
            '<div id="stIconsSection">' + buildIconRowsHtml(currentDefaultIcons, 'stIconsSection') + '</div>',
            missingIconsWarningHtml(currentDefaultIcons, 'Default icons are not set for'),
          '</div>',
          '<div class="field" style="margin-top:14px">',
            '<label>Default route line</label>',
            '<div style="display:flex;align-items:center;gap:6px">',
              '<input id="stRouteLineId" value="' + esc(currentDefaultRouteLineId || '') + '" placeholder="Figma link / node-id" style="flex:1;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:inherit;outline:none">',
              '<button class="btn-sm btn-secondary" id="stRouteLinePickBtn" title="З виділення">⊡</button>',
            '</div>',
          '</div>',
        '</div>',
        '<div class="buttons">',
          '<button class="btn-secondary" id="stCancelBtn">Cancel</button>',
          '<button class="btn-primary"   id="stSaveBtn">Save</button>',
        '</div>',
      ].join('');

      var scaleEl   = document.getElementById('stScale');
      var preview   = document.getElementById('stScalePreview');
      var routeLineEl = document.getElementById('stRouteLineId');
      var saveBtn   = document.getElementById('stSaveBtn');
      var cancelBtn = document.getElementById('stCancelBtn');
      var routeLinePickBtn = document.getElementById('stRouteLinePickBtn');

      scaleEl.addEventListener('input', function() {
        var v = parseFloat(scaleEl.value) || 1;
        preview.textContent = 'Основний текст: 16 × ' + v + ' = ' + Math.round(16 * v) + 'px';
      });
      bindIconPickButtons('stIconsSection');
      routeLinePickBtn.addEventListener('click', function() { pickSelectionInto('#stRouteLineId'); });

      cancelBtn.addEventListener('click', function() { send({ type: 'close' }); });

      saveBtn.addEventListener('click', function() {
        var sc = Math.max(0.1, Math.min(200, parseFloat(scaleEl.value) || 1));
        send({
          type: 'save-settings',
          scale: sc,
          defaultIcons: collectIconsFromSection('stIconsSection'),
          defaultRouteLineId: parseFigmaNodeId(routeLineEl.value.trim()) || ''
        });
      });

      setTimeout(function() { scaleEl.focus(); scaleEl.select(); }, 0);
    }

        // ─── Utils ───────────────────────────────────────────────────────────────

    // Normalize clipboard names so FIR entries match catalog keys.
    function normKey(s) {
      return String(s)
        .replace(/’/g, "'")
        .replace(/‘/g, "'")
        .replace(/\s+\(Ящик\)$/i, ' (Crate)');
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }
  </script>
</body>
</html>
